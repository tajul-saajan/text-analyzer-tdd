apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: text-analyzer
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
  - port: 5050 # service's own port
    targetPort: 5050 # pod's port
    nodePort: 30050 # the node's port
    protocol: TCP
  type: NodePort